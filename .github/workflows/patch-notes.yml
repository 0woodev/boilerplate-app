name: Patch Notes Sync

# ACTIVITY.md → PatchNote 멱등 동기화 + L2 LLM body 초안 생성.
# 오케스트레이터(app) 레포 소유: ACTIVITY.md 가 여기 있고, 서브모듈(be)을
# 체크아웃해 be/scripts/generate_patch_notes.py 를 실행한다.
# (be 단독 체크아웃에는 ../ACTIVITY.md 가 없으므로 이 워크플로는 app 에 둔다.)
on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'L2 LLM provider (anthropic|openai)'
        required: false
        default: 'openai'
      model:
        description: 'L2 모델 ID (미설정 시 provider 기본값)'
        required: false
        default: ''
  push:
    branches: [dev, main]
    paths:
      - 'ACTIVITY.md'

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      STAGE: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
      # 선택된 provider 의 키만 있으면 동작. 존재하는 secret 만 전달된다.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PATCH_NOTES_PROVIDER: ${{ inputs.provider || 'openai' }}
      PATCH_NOTES_MODEL: ${{ inputs.model || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT_NAME }}-${{ env.STAGE }}-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        working-directory: be
        run: pip install -r requirements-dev.txt -q

      # ACTIVITY.md 는 루트(app)에 있고, be 작업 디렉터리에서 ../ACTIVITY.md 로 참조된다.
      - name: Sync patch notes (L1 + L2 LLM draft)
        working-directory: be
        run: python scripts/generate_patch_notes.py --llm
